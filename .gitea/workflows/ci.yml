# Gitea and Forgejo Actions. When .gitea/workflows exists, Gitea runs these instead of
# .github/workflows (whose Windows job a self-hosted Linux runner could not pick up).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
