# Orco on your network.
#   docker compose up -d
#   docker compose exec orco orco user add <you>
# Builds the image from this checkout. To run a prebuilt image instead (Komodo, a Gitea registry),
# use deploy/compose.registry.yml; see docs/komodo.md.
# With HTTPS through Caddy (see docs/deploy.md):
#   ORCO_DOMAIN=orco.office.lan ORCO_TRUST_PROXY=uniquelocal docker compose --profile tls up -d
services:
  orco:
    image: orco:latest
    build: .
    restart: unless-stopped
    ports:
      - "${ORCO_BIND:-127.0.0.1}:7420:7420"
    volumes:
      - orco-data:/data
    environment:
      ORCO_TRUST_PROXY: ${ORCO_TRUST_PROXY:-}
      ORCO_PUBLIC_URL: ${ORCO_PUBLIC_URL:-}
      ORCO_SECRETS_KEY: ${ORCO_SECRETS_KEY:-}
      ORCO_ESCALATE_HOURS: ${ORCO_ESCALATE_HOURS:-}
      ORCO_TASK_STALL_MINUTES: ${ORCO_TASK_STALL_MINUTES:-}
      ORCO_MAX_TASK_DEPTH: ${ORCO_MAX_TASK_DEPTH:-}
      ORCO_AGENT_POSTS_PER_MINUTE: ${ORCO_AGENT_POSTS_PER_MINUTE:-}
      ORCO_AGENT_TASKS_PER_MINUTE: ${ORCO_AGENT_TASKS_PER_MINUTE:-}

  caddy:
    image: caddy:2
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ORCO_DOMAIN: ${ORCO_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - orco

volumes:
  orco-data:
  caddy-data:
