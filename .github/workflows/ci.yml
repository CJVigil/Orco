name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22', '24']
        include:
          # Windows is supported without Docker (see docs/quickstart.md).
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose files are valid
        run: |
          docker compose config --quiet
          ORCO_IMAGE=orco:ci docker compose -f deploy/compose.registry.yml config --quiet
      - run: docker build -t orco:ci .
      - name: Smoke test
        run: |
          docker run -d --name orco -p 127.0.0.1:7420:7420 orco:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:7420/healthz && break; sleep 1; done
          docker exec orco orco user add ci
          docker exec orco sh -c 'ls /backups | grep -q "^orco-.*\.db$"'
          curl -fs http://127.0.0.1:7420/ | grep -q '<title>Orco</title>'
