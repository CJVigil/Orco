<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Orco</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <section id="login" class="login" hidden>
      <form id="login-form" class="login-card">
        <div class="brand"><span class="logo" aria-hidden="true"></span>Orco</div>
        <p class="muted">Sign in with your user token. A server admin creates it with
          <code>orco-server user add &lt;name&gt;</code>.</p>
        <label for="login-token">User token</label>
        <input id="login-token" name="token" type="password" autocomplete="current-password" required
          placeholder="orco_u_…" />
        <p id="login-error" class="error" role="alert" hidden></p>
        <button type="submit" class="primary">Sign in</button>
      </form>
    </section>

    <div id="app" class="app" hidden>
      <aside id="sidebar" class="sidebar" aria-label="Rooms">
        <header class="sidebar-head">
          <div class="brand"><span class="logo" aria-hidden="true"></span>Orco</div>
        </header>
        <form id="search-form" class="search" role="search">
          <input id="search-input" type="search" placeholder="Search messages" aria-label="Search messages" autocomplete="off" />
        </form>
        <button id="inbox" class="inbox-link" type="button">
          <span>Inbox</span>
          <span id="inbox-badge" class="badge" hidden></span>
        </button>
        <nav id="nav" class="nav"></nav>
        <button id="new-project" class="ghost wide" type="button">+ New project</button>
        <button id="my-agents" class="ghost wide" type="button">My agents</button>
        <footer class="me">
          <span id="me-avatar" class="avatar" aria-hidden="true"></span>
          <span id="me-name" class="me-name"></span>
          <button id="theme" class="ghost small" type="button" title="Theme">System</button>
          <button id="logout" class="ghost small" type="button">Sign out</button>
        </footer>
      </aside>

      <main class="main">
        <header class="room-head">
          <button id="toggle-sidebar" class="ghost icon only-narrow" type="button" aria-label="Show rooms">☰</button>
          <h1 id="room-title" class="room-title"></h1>
          <span id="connection" class="connection" title="Live updates"></span>
          <button id="show-locks" class="ghost small" type="button" hidden>Locks</button>
          <button id="show-members" class="ghost small" type="button">Members</button>
          <button id="add-member" class="ghost small" type="button" hidden>+ Add member</button>
          <a id="audit-log" class="ghost small button-link" hidden>Audit log</a>
        </header>
        <div id="messages" class="messages" aria-live="polite">
          <button id="load-older" class="ghost small center" type="button" hidden>Load older messages</button>
          <ol id="message-list" class="message-list"></ol>
          <p id="empty" class="empty muted" hidden>No messages yet. Say hello, or mention an agent with @name.</p>
        </div>
        <div id="composer-pending" class="pending" aria-label="Images to send"></div>
        <form id="composer" class="composer">
          <button type="button" class="ghost icon attach" title="Attach images" aria-label="Attach images">📎</button>
          <input type="file" class="attach-input" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden />
          <textarea id="composer-text" rows="1" placeholder="Message, or /task @agent what you need" aria-label="Message"></textarea>
          <button type="submit" class="primary">Send</button>
        </form>
      </main>

      <aside id="panel" class="panel" hidden>
        <header class="panel-head">
          <h2 id="panel-title"></h2>
          <button id="close-panel" class="ghost icon" type="button" aria-label="Close">✕</button>
        </header>
        <div id="panel-body" class="panel-body"></div>
        <div id="thread-pending" class="pending" aria-label="Images to send"></div>
        <form id="thread-composer" class="composer" hidden>
          <button type="button" class="ghost icon attach" title="Attach images" aria-label="Attach images">📎</button>
          <input type="file" class="attach-input" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden />
          <textarea id="thread-text" rows="1" placeholder="Reply in thread" aria-label="Reply in thread"></textarea>
          <button type="submit" class="primary">Reply</button>
        </form>
      </aside>
    </div>

    <dialog id="ask" class="ask">
      <form method="dialog" id="ask-form">
        <h2 id="ask-title"></h2>
        <label id="ask-label" for="ask-input"></label>
        <input id="ask-input" autocomplete="off" />
        <p id="ask-hint" class="muted small"></p>
        <p id="ask-error" class="error" role="alert" hidden></p>
        <div class="row-end">
          <button value="cancel" class="ghost" type="button" id="ask-cancel">Cancel</button>
          <button value="ok" class="primary" type="submit">OK</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
